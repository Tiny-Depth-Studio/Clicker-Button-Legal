<style>

    --text: #eef3fb;
    --text-dim: #a5b2c8;

    --bg: #eef4fc;
    --bg-soft: #e2ebf7;
    --card: rgba(20, 15, 8, 0.04);
    --card-hover: rgba(20, 15, 8, 0.075);

    --text-dim: #46546b;
    --text-faint: #6c7a90;

    --accent-strong: #855300;
    --accent-2: #1f63b8;

    --line-strong: rgba(30, 24, 16, 0.26);

  @media (prefers-color-scheme: light) {

      --bg-soft: #e2ebf7;
      --card: rgba(20, 15, 8, 0.04);
      --card-hover: rgba(20, 15, 8, 0.075);

      --text-dim: #46546b;
      --text-faint: #6c7a90;

      --line-strong: rgba(30, 24, 16, 0.26);
      --glow: rgba(168, 106, 0, 0.18);

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);

  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }

  .wrap {

    padding: 0 clamp(1.1rem, 5vw, 2.6rem);

    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(140%);

  .topbar-inner {
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 0.65rem clamp(1.1rem, 5vw, 2.6rem);

    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;

  .topbar-brand {
    justify-self: start;

    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: var(--text);

  .topbar-brand:hover { color: var(--text); }
  .topbar-nav {

    gap: 1.4rem;

  .topbar-nav a:hover { color: var(--text); }
  .topbar-cta { justify-self: end; }

  /* ---------- buttons ---------- */
  .btn {

    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: inherit;
    font-size: 0.94rem;
    font-weight: 600;
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    border: 1px solid transparent;
    background: linear-gradient(135deg, var(--accent-strong), var(--accent));

    box-shadow: 0 8px 24px -10px var(--glow);
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;

  .btn:hover {

    color: var(--text);
    border-color: var(--line-strong);

    backdrop-filter: blur(6px);

  .btn.ghost:hover { background: var(--card-hover); color: var(--text); }

  /* ---------- hero ---------- */

    overflow: hidden;

  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: cover;
    filter: blur(26px) saturate(120%);
    transform: scale(1.15);
    opacity: 0.5;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(60% 50% at 50% 0%, var(--glow), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb, var(--bg) 55%, transparent) 0%, var(--bg) 78%);

  .kicker {
    display: inline-block;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;

  .lede {

  .hero-actions {

  section.block { padding: clamp(3.2rem, 8vw, 5.2rem) 0; }

  .news-card {

  .news-card:hover {

  .news-meta {

    font-weight: 600;

  }

  .media-grid {

    grid-template-columns: repeat(auto-fit, minmax(248px, 1fr));
    gap: 0.85rem;
  }
  .shot {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--bg-soft);

  }
  .shot:hover { transform: translateY(-3px); border-color: var(--line-strong); }
  .shot img { aspect-ratio: 16 / 9; object-fit: cover; transition: transform 0.35s ease; }
  .shot:hover img { transform: scale(1.05); }
  .shot.trailer { grid-column: span 2; }
  .shot.trailer::after {
    content: "▶";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 2.2rem;
    color: #fff8ec;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    background: linear-gradient(180deg, rgba(10, 15, 26, 0.1), rgba(10, 15, 26, 0.45));
  }

  /* ---------- languages ---------- */
  .lang-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.7rem;
  }
  .lang-card {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-align: left;
    padding: 0.85rem 1rem;

  .lang-text { display: flex; flex-direction: column; min-width: 0; }
  .lang-text strong { font-size: 0.96rem; font-weight: 600; color: var(--text); line-height: 1.25; }

    .topbar-inner { grid-template-columns: 1fr auto; }
    .topbar-nav { display: none; }
    .shot.trailer { grid-column: span 1; }
